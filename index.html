<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>올리브영 G.L.C 매장 응대 모바일 퀴즈</title>
    <style>
        :root {
            --oy-green: #9BCE26;
            --cj-blue: #0055A5;
            --cj-red: #E02020;
            --bg-color: #F4F6F8;
            --card-bg: #FFFFFF;
            --text-color: #222222;
        }
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 12px;
            display: flex;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }
        .quiz-container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            border-radius: 18px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            padding: 18px;
            box-sizing: border-box;
            position: relative;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .refresh-btn {
            background: #E2E8F0;
            border: none;
            border-radius: 20px;
            padding: 6px 12px;
            font-size: 0.75rem;
            font-weight: bold;
            color: #4A5568;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .header {
            text-align: center;
            border-bottom: 2px solid #EEEEEE;
            padding-bottom: 12px;
            margin-bottom: 14px;
        }
        .header h1 {
            font-size: 1.2rem;
            color: var(--cj-blue);
            margin: 0 0 4px 0;
        }
        .header p {
            font-size: 0.8rem;
            color: #666;
            margin: 0;
        }
        .progress-bar {
            width: 100%;
            background-color: #E9ECEF;
            height: 8px;
            border-radius: 4px;
            margin-bottom: 14px;
            overflow: hidden;
        }
        .progress {
            width: 0%;
            height: 100%;
            background-color: var(--oy-green);
            transition: width 0.3s ease;
        }
        .comic-canvas-container {
            width: 100%;
            height: 160px;
            background-color: #EBF8FF;
            border: 2px solid #3182CE;
            border-radius: 12px;
            margin-bottom: 10px;
            overflow: hidden;
        }
        canvas {
            width: 100%;
            height: 100%;
        }
        .comic-box {
            background-color: #FFF9E6;
            border: 1.5px dashed #FFC107;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 12px;
            font-size: 0.88rem;
            line-height: 1.4;
        }
        .scene-tag {
            display: inline-block;
            background-color: var(--cj-blue);
            color: white;
            font-weight: bold;
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 4px;
            margin-bottom: 6px;
        }
        .audio-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background-color: var(--oy-green);
            color: black;
            font-weight: bold;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 10px;
            cursor: pointer;
            margin-bottom: 14px;
            font-size: 0.9rem;
        }
        .question-title {
            font-size: 0.98rem;
            font-weight: bold;
            margin-bottom: 12px;
            line-height: 1.4;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .option-btn {
            background-color: #F8F9FA;
            border: 1px solid #DEE2E6;
            padding: 12px 14px;
            border-radius: 10px;
            text-align: left;
            font-size: 0.88rem;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            line-height: 1.3;
        }
        .option-btn.correct {
            background-color: #D4EDDA !important;
            border-color: #C3E6CB !important;
            color: #155724;
            font-weight: bold;
        }
        .option-btn.incorrect {
            background-color: #F8D7DA !important;
            border-color: #F5C6CB !important;
            color: #721C24;
        }
        .mini-audio-btn {
            background: none;
            border: none;
            font-size: 1.1rem;
            padding: 2px 4px;
            margin-left: 8px;
        }
        .feedback {
            margin-top: 12px;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            display: none;
            line-height: 1.4;
        }
        .feedback.show {
            display: block;
        }
        .feedback.correct {
            background-color: #E8F5E9;
            color: #2E7D32;
            border: 1px solid #C8E6C9;
        }
        .feedback.incorrect {
            background-color: #FFEBEE;
            color: #C62828;
            border: 1px solid #FFCDD2;
        }
        .nav-buttons {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }
        .nav-btn {
            flex: 1;
            padding: 12px;
            font-size: 0.95rem;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        .prev-btn {
            background-color: #E2E8F0;
            color: #4A5568;
        }
        .next-btn {
            background-color: var(--cj-blue);
            color: white;
        }
        .result-screen {
            text-align: center;
            display: none;
        }
        .result-score {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--oy-green);
            margin: 16px 0;
        }
        .restart-btn {
            background-color: var(--cj-blue);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <div class="top-bar">
        <span style="font-size: 0.75rem; color: #718096; font-weight: bold;" id="save-status">💾 자동 저장됨</span>
        <button class="refresh-btn" onclick="manualRefresh()">🔄 새로고침 (Pull-to-Refresh)</button>
    </div>

    <div class="header">
        <h1>올리브영 G.L.C 매장 응대 퀴즈</h1>
        <p>15문항 스토리 만화 & 리스닝 지원 (모바일 전용)</p>
    </div>

    <div class="progress-bar">
        <div class="progress" id="progress"></div>
    </div>

    <div id="quiz-screen">
        <div class="comic-canvas-container">
            <canvas id="comicCanvas" width="500" height="160"></canvas>
        </div>

        <div class="comic-box">
            <span class="scene-tag" id="scene-tag">장면 1</span>
            <div id="comic-text">상황 설명이 표시됩니다.</div>
        </div>

        <button class="audio-btn" onclick="playSituationTTS()">
            🔊 상황 원어민 발음 듣기
        </button>

        <div class="question-card">
            <div class="question-title" id="question-text">질문이 표시됩니다.</div>
            <div class="options" id="options-container"></div>
        </div>

        <div class="feedback" id="feedback-box"></div>

        <div class="nav-buttons">
            <button class="nav-btn prev-btn" id="prev-btn" onclick="prevQuestion()">◀ 이전</button>
            <button class="nav-btn next-btn" id="next-btn" onclick="nextQuestion()">다음 ▶</button>
        </div>
    </div>

    <div class="result-screen" id="result-screen">
        <h2>🎉 미션 완수!</h2>
        <p>올리브영 글로벌 매장 응대 퀴즈 결과:</p>
        <div class="result-score" id="score-text">0 / 15</div>
        <p id="result-message" style="margin-bottom: 20px; font-weight: bold;">결과 메시지</p>
        <button class="restart-btn" onclick="restartQuiz()">처음부터 다시 풀기</button>
    </div>
</div>

    let currentQuestionIndex = 0;
    let score = 0;
    let userAnswers = new Array(quizData.length).fill(null);

    // LocalStorage를 활용한 모바일 데이터 유지
    function saveData() {
        const data = {
            index: currentQuestionIndex,
            score: score,
            answers: userAnswers
        };
        localStorage.setItem("oy_quiz_state", JSON.stringify(data));
        document.getElementById("save-status").innerText = "💾 저장 완료";
    }

    function loadData() {
        const saved = localStorage.getItem("oy_quiz_state");
        if (saved) {
            const data = JSON.parse(saved);
            currentQuestionIndex = data.index || 0;
            score = data.score || 0;
            userAnswers = data.answers || new Array(quizData.length).fill(null);
        }
    }

    function manualRefresh() {
        saveData();
        location.reload();
    }

    function drawCartoon(type) {
        const canvas = document.getElementById("comicCanvas");
        const ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        let grad = ctx.createLinearGradient(0, 0, 500, 160);
        grad.addColorStop(0, "#EBF8FF");
        grad.addColorStop(1, "#FEFCBF");
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = "#3182CE";
        ctx.lineWidth = 4;
        ctx.strokeRect(3, 3, canvas.width - 6, canvas.height - 6);

        // 스태프
        ctx.fillStyle = "#9BCE26";
        ctx.beginPath(); ctx.arc(120, 120, 35, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#FFE0B2";
        ctx.beginPath(); ctx.arc(120, 70, 25, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#222";
        ctx.beginPath(); ctx.arc(112, 65, 3, 0, Math.PI * 2); ctx.arc(128, 65, 3, 0, Math.PI * 2); ctx.fill();

        // 고객
        ctx.fillStyle = "#3182CE";
        ctx.beginPath(); ctx.arc(380, 120, 35, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#FFCC80";
        ctx.beginPath(); ctx.arc(380, 70, 25, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#222";
        ctx.beginPath(); ctx.arc(372, 65, 3, 0, Math.PI * 2); ctx.arc(388, 65, 3, 0, Math.PI * 2); ctx.fill();

        // 말풍선
        ctx.fillStyle = "#FFFFFF";
        ctx.strokeStyle = "#1A202C";
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.roundRect(170, 15, 160, 50, 12); ctx.fill(); ctx.stroke();

        ctx.fillStyle = "#2D3748";
        ctx.font = "bold 13px Pretendard, sans-serif";
        ctx.textAlign = "center";

        let bubbleText = "Welcome!";
        if(type === "entrance") bubbleText = "Welcome to OY! 💚";
        else if(type === "search") bubbleText = "Checking for you! 🔎";
        else if(type === "guide") bubbleText = "Follow me! ➡️";
        else if(type === "sale") bubbleText = "It's ON SALE! 🏷️";
        else if(type === "bogo") bubbleText = "1 + 1 EVENT! 🎉";
        else if(type === "calendar") bubbleText = "Until Weekend! 📅";
        else if(type === "instock") bubbleText = "In Stock Now! 📦";
        else if(type === "outstock") bubbleText = "Out of Stock 😢";
        else if(type === "taxfree") bubbleText = "Tax-Free Here! ✈️";
        else if(type === "gift") bubbleText = "Free Gift! 🎁";
        else if(type === "freeone") bubbleText = "1 More Free! 🎁";
        else if(type === "refund") bubbleText = "15 Days Refund 🔄";
        else if(type === "wait") bubbleText = "Just a moment! ⏱️";
        else if(type === "time") bubbleText = "Takes 1 minute ⚡";
        else if(type === "exit") bubbleText = "This way out! 👋";

        ctx.fillText(bubbleText, 250, 44);
    }

    // 정답 사전 유출 방지: 오직 사용자가 버튼을 누를 때만 음성 재생
    function playTTS(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        }
    }

    function playSituationTTS() {
        const currentQuiz = quizData[currentQuestionIndex];
        playTTS(currentQuiz.audioText);
    }

    function loadQuestion() {
        window.speechSynthesis.cancel(); // 자동 재생 차단
        const currentQuiz = quizData[currentQuestionIndex];
        
        document.getElementById("progress").style.width = `${((currentQuestionIndex + 1) / quizData.length) * 100}%`;
        document.getElementById("scene-tag").innerText = currentQuiz.scene;
        document.getElementById("comic-text").innerText = currentQuiz.comic;
        document.getElementById("question-text").innerText = currentQuiz.question;
        
        drawCartoon(currentQuiz.cartoonType);

        // 이전/다음 버튼 제어
        document.getElementById("prev-btn").style.visibility = (currentQuestionIndex === 0) ? "hidden" : "visible";
        document.getElementById("next-btn").innerText = (currentQuestionIndex === quizData.length - 1) ? "결과 보기 🏆" : "다음 ▶";

        const optionsContainer = document.getElementById("options-container");
        optionsContainer.innerHTML = "";

        const feedbackBox = document.getElementById("feedback-box");
        feedbackBox.className = "feedback";
        feedbackBox.style.display = "none";

        const savedAnswer = userAnswers[currentQuestionIndex];

        currentQuiz.options.forEach((option, index) => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            
            const textSpan = document.createElement("span");
            textSpan.innerText = option;

            const audioSpan = document.createElement("button");
            audioSpan.className = "mini-audio-btn";
            audioSpan.innerText = "🔊";
            audioSpan.onclick = (e) => {
                e.stopPropagation();
                playTTS(option);
            };

            btn.appendChild(textSpan);
            btn.appendChild(audioSpan);

            // 이미 답을 선택한 복습 상태 처리
            if (savedAnswer !== null) {
                if (index === currentQuiz.correct) {
                    btn.classList.add("correct");
                }
                if (savedAnswer === index && index !== currentQuiz.correct) {
                    btn.classList.add("incorrect");
                }
            }

            btn.onclick = () => selectOption(index);
            optionsContainer.appendChild(btn);
        });

        if (savedAnswer !== null) {
            feedbackBox.innerText = (savedAnswer === currentQuiz.correct ? "🎉 정답입니다! " : "💡 오답입니다. ") + currentQuiz.explanation;
            feedbackBox.className = "feedback show " + (savedAnswer === currentQuiz.correct ? "correct" : "incorrect");
        }

        saveData();
    }

    function selectOption(selectedIndex) {
        if (userAnswers[currentQuestionIndex] !== null) return; // 이미 답변한 경우 변경 불가

        userAnswers[currentQuestionIndex] = selectedIndex;
        const currentQuiz = quizData[currentQuestionIndex];

        if (selectedIndex === currentQuiz.correct) {
            score++;
        }

        loadQuestion();
    }

    function prevQuestion() {
        if (currentQuestionIndex > 0) {
            currentQuestionIndex--;
            loadQuestion();
        }
    }

    function nextQuestion() {
        if (userAnswers[currentQuestionIndex] === null) {
            alert("답안을 먼저 선택해 주세요!");
            return;
        }

        if (currentQuestionIndex < quizData.length - 1) {
            currentQuestionIndex++;
            loadQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        document.getElementById("quiz-screen").style.display = "none";
        document.getElementById("result-screen").style.display = "block";
        document.getElementById("score-text").innerText = `${score} / ${quizData.length}`;
        
        let msg = "";
        if(score === 15) msg = "🏆 완벽합니다! 당신은 올리브영 최고의 글로벌 CS 앰버서더입니다!";
        else if(score >= 11) msg = "👍 훌륭합니다! 글로벌 고객을 완벽히 응대할 수 있습니다!";
        else msg = "😊 조금만 더 연습하면 멋진 글로벌 매장 스태프가 됩니다!";
        
        document.getElementById("result-message").innerText = msg;
        localStorage.removeItem("oy_quiz_state"); // 종료 시 초기화
    }

    function restartQuiz() {
        localStorage.removeItem("oy_quiz_state");
        currentQuestionIndex = 0;
        score = 0;
        userAnswers = new Array(quizData.length).fill(null);
        document.getElementById("quiz-screen").style.display = "block";
        document.getElementById("result-screen").style.display = "none";
        loadQuestion();
    }

    window.onload = function() {
        loadData();
        loadQuestion();
    };
</script>
